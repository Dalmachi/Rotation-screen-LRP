<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LRP Device Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: three devices on a rotating ring over the site's own blue-to-white gradient; arrows at the left and right edges, tabs and controls in a dock */
:root{--blue:#009FE3;--sky:#61C4ED;--ink:#0b3d5c;--muted:#2c6a8c;--metal:#c9d1d8;--metal-d:#8d98a2;--bezel:#0b0d10;--ui:Inter,system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff linear-gradient(135deg,#61C4ED 0%,#fff 100%) fixed;color:var(--ink);font-family:var(--ui);overflow:hidden;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;padding-block:0 max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;min-height:0}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y}
.slot{position:absolute;left:50%;top:50%;transform-origin:50% 50%;transition:width .7s ease,height .7s ease;will-change:transform}
.device{position:absolute;inset:0;background:var(--bezel);box-shadow:0 0 0 2px var(--metal-d),0 0 0 4px #2a3138,0 40px 80px rgba(10,70,110,.35)}
.screen{position:absolute;overflow:hidden;background:#fff}
.screen iframe{display:block;border:0;width:100%;height:100%;background:#fff}
.cam{position:absolute;border-radius:50%;background:#1b2430;box-shadow:inset 0 0 0 2px #2c3846;top:50%}
.gshadow{position:absolute;left:3%;right:3%;top:100%;height:60px;margin-top:14px;background:radial-gradient(ellipse at center,rgba(8,60,100,.45) 0%,rgba(8,60,100,.18) 45%,rgba(8,60,100,0) 72%);filter:blur(5px);pointer-events:none}
.computer-slot .gshadow{left:-8%;right:-8%;margin-top:46px}
.hit{position:absolute;inset:-6px;z-index:20;cursor:pointer;border-radius:inherit}
.computer{border-radius:30px 30px 8px 8px}
.computer .cam{width:10px;height:10px;top:6px;left:50%;margin-left:-5px}
.base{position:absolute;left:-120px;right:-120px;top:100%;height:34px;margin-top:2px;background:linear-gradient(#e3e8ec,var(--metal) 40%,var(--metal-d));border-radius:0 0 40px 40px/0 0 22px 22px;box-shadow:0 20px 40px rgba(10,70,110,.3)}
.base::before{content:"";position:absolute;left:50%;top:0;width:220px;height:10px;margin-left:-110px;background:#aab3bb;border-radius:0 0 14px 14px}
.ipad{border-radius:56px}.ipad .screen{border-radius:32px}
.ipad .cam{width:12px;height:12px;top:7px;left:50%;margin-left:-6px}
.homebar{position:absolute;z-index:3;left:50%;bottom:8px;width:160px;height:6px;margin-left:-80px;border-radius:3px;background:rgba(0,0,0,.55)}
.phone{border-radius:66px}.phone .screen{border-radius:52px}
.island{position:absolute;z-index:4;top:11px;left:50%;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#000}
.statusbar{position:absolute;z-index:3;top:0;left:0;right:0;height:54px;padding:16px 34px 0;display:flex;justify-content:space-between;font:600 15px var(--ui);color:#111;background:#fff}
.statusbar i{font-style:normal;letter-spacing:2px}
.phone .screen iframe{margin-top:54px;height:calc(100% - 54px)}
/* controls share the page's blue pill with a white ring */
.ring-btn{border:0;background:var(--blue);color:#fff;cursor:pointer;display:grid;place-items:center;border-radius:50%;flex:none;box-shadow:0 8px 24px rgba(0,159,227,.4),0 0 0 3px #fff}
.ring-btn:hover{background:#0087c2}
.ring-btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.arrow{position:absolute;top:50%;margin-top:-28px;width:56px;height:56px;z-index:70}
#prev{left:max(4px,env(safe-area-inset-left,0px))}#next{right:max(4px,env(safe-area-inset-right,0px))}
@media(max-width:560px){.arrow{width:44px;height:44px;margin-top:-22px}}
</style>
</head>
<body>
<div class="app">
 <div class="stage" id="stage">
  <button class="ring-btn arrow" id="prev" aria-label="Rotate left"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
  <button class="ring-btn arrow" id="next" aria-label="Rotate right"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
 </div>
</div>

<script>
(function(){
var SRC='site.html?embed=1';
var D=[{k:'computer',n:'Computer',b:22,sw:1440,sh:900,box:[1724,990],m:1},
       {k:'ipad',n:'iPad',b:26,sw:1180,sh:820,box:[1232,872],m:1},
       {k:'phone',n:'iPhone',b:14,sw:390,sh:844,box:[418,872],m:.79}]; /* m: real-world size relative to the laptop and iPad (iPhone screen is about 6.5 cm wide vs 23-30 cm) */
var stage=document.getElementById('stage');
D.forEach(function(d,i){
 var s=document.createElement('div');s.className='slot';
 var extra=d.k==='computer'?'<div class="base"></div>':'';
 var inner=d.k==='phone'?'<div class="statusbar"><span>9:41</span><i>\u25cf\u25cf\u25cf \u25ae</i></div>':'';
 var top=d.k==='phone'?'<div class="island"></div>':'<div class="cam"></div>';
 if(d.k==='computer')s.classList.add('computer-slot');
 s.innerHTML='<div class="gshadow"></div><div class="device '+d.k+'">'+top+'<div class="screen" style="inset:'+d.b+'px">'+inner+'<iframe title="'+d.n+' preview" allow="autoplay" loading="eager"></iframe>'+(d.k==='computer'?'':'<div class="homebar"></div>')+'</div>'+extra+'<div class="hit" hidden></div></div>';
 s.style.width=(d.sw+2*d.b)+'px';s.style.height=(d.sh+2*d.b)+'px';
 stage.appendChild(s);d.slot=s;d.hit=s.querySelector('.hit');d.fr=s.querySelector('iframe');d.fr.src=SRC;
 d.hit.onclick=function(e){e.stopPropagation();goTo(i)};
});
var pos=0,target=0,raf=0,tm=0;
function mod(n){return ((n%3)+3)%3}
/* only while the iPhone is in front: iPad nudges left, laptop nudges right */
function spread(d){
 if(d.k==='phone')return 0;
 var dp=((2-pos+1.5)%3+3)%3-1.5,w=Math.max(0,1-Math.abs(dp));w=w*w*(3-2*w);
 return (d.k==='ipad'?-1:1)*36*w;
}
function render(){
 var W=stage.clientWidth,H=stage.clientHeight-16,front=mod(Math.round(pos));
 var S=Math.min(.8*W/1724,H*.94/990,1); /* one shared scale, so sizes stay true to each other */
 D.forEach(function(d,i){
  var a=(i-pos)*2*Math.PI/3,c=Math.cos(a),t=Math.max(0,Math.min(1,(c+.5)/1.5));
  var e=t*t*(3-2*t),s=S*d.m*(.6+.4*e);
  var x=Math.sin(a)/.866*(W/2-74-(d.sw+2*d.b)*S*d.m*.3)+spread(d),y=-(1-e)*.04*H-(d.k==='computer'?20*s:0);
  d.slot.style.transform='translate(-50%,-50%) translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) scale('+s.toFixed(4)+')';
  d.slot.style.zIndex=Math.round(t*10)+1;
  d.slot.style.opacity=(.82+.18*e).toFixed(2);
  d.hit.hidden=i===front;
  d.fr.style.pointerEvents=i===front?'auto':'none';
 });
}
function animate(){
 cancelAnimationFrame(raf);var from=pos,to=target,t0=performance.now(),dur=1000;
 (function step(now){var p=Math.min(1,(now-t0)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;pos=from+(to-from)*e;render();
  if(p<1)raf=requestAnimationFrame(step);else{pos=to;render();schedule()}})(t0);
}
/* autoplay is always on; any manual move restarts the wait before the next turn */
function schedule(){clearTimeout(tm);tm=setTimeout(function(){target+=1;animate()},4200)}
function step(n){target=Math.round(target)+n;animate()}
function goTo(i){var d=mod(i-mod(target));if(d===0)return;step(d===2?-1:1)}
document.getElementById('prev').onclick=function(){step(-1)};
document.getElementById('next').onclick=function(){step(1)};
function key(k){if(k==='ArrowLeft')step(-1);if(k==='ArrowRight')step(1)}
addEventListener('keydown',function(e){key(e.key)});
addEventListener('message',function(e){if(e.data&&e.data.k)key(e.data.k)});
var x0=null;stage.addEventListener('pointerdown',function(e){x0=e.clientX});
stage.addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>80)step(dx<0?1:-1)});
addEventListener('resize',render);
render();schedule();
})();
</script>
</body>
</html>
